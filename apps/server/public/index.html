<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesaos - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ededed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #fff;
            color: #111;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.15s;
        }
        .btn:hover { background: #f0f0f0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn svg { width: 20px; height: 20px; }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #555;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2a2a2a;
        }
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #ededed;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #666; }
        .btn-email {
            background: #2563eb;
            color: #fff;
            border: none;
            margin-top: 6px;
        }
        .btn-email:hover { background: #1d4ed8; }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .status.success { display: block; background: #052e16; color: #4ade80; border: 1px solid #166534; }
        .status.error { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
        .status.loading { display: block; background: #1a1a1a; color: #888; border: 1px solid #2a2a2a; }
        .session-info {
            margin-top: 20px;
            padding: 16px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
        .session-info.visible { display: block; }
        .session-info pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #a5b4fc;
        }
        .session-info .label { color: #666; margin-bottom: 4px; }
        .logout-btn {
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: transparent;
            color: #f87171;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
        .logout-btn:hover { background: #1a0505; }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="auth-view">
            <h1>Artesaos</h1>
            <p class="subtitle">Entre na sua conta</p>

            <button class="btn" onclick="googleLogin()" id="google-btn">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Entrar com Google
            </button>

            <div class="divider">ou</div>

            <form onsubmit="emailLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn btn-email" id="email-btn">Entrar</button>
            </form>

            <div id="status" class="status"></div>
        </div>

        <div id="session-view" style="display:none">
            <img id="avatar" class="user-avatar" src="" alt="">
            <h1 id="user-name"></h1>
            <p class="subtitle" id="user-email"></p>

            <div class="session-info visible">
                <div class="label">Sessão</div>
                <pre id="session-data"></pre>
            </div>

            <button class="logout-btn" onclick="logout()">Sair</button>
        </div>
    </div>

    <script>
        const BASE = window.location.origin;

        function setStatus(msg, type) {
            const el = document.getElementById('status');
            el.className = 'status ' + type;
            el.textContent = msg;
        }

        async function checkSession() {
            try {
                const res = await fetch(`${BASE}/api/auth/get-session`, { credentials: 'include' });
                const data = await res.json();
                if (data.data && data.data.session) {
                    showSession(data.data);
                }
            } catch {}
        }

        function showSession(data) {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('session-view').style.display = 'block';
            document.getElementById('user-name').textContent = data.user.name || 'User';
            document.getElementById('user-email').textContent = data.user.email || '';
            document.getElementById('session-data').textContent = JSON.stringify(data, null, 2);
            if (data.user.image) {
                document.getElementById('avatar').src = data.user.image;
                document.getElementById('avatar').style.display = 'block';
            } else {
                document.getElementById('avatar').style.display = 'none';
            }
        }

        async function googleLogin() {
            const btn = document.getElementById('google-btn');
            btn.disabled = true;
            setStatus('Redirecionando...', 'loading');

            try {
                const res = await fetch(`${BASE}/api/auth/sign-in/social`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        provider: 'google',
                        callbackURL: `${BASE}/`
                    })
                });
                const data = await res.json();

                if (data.error) {
                    setStatus(data.error.message || 'Erro ao autenticar', 'error');
                    btn.disabled = false;
                    return;
                }

                if (data.url) {
                    window.location.href = data.url;
                }
            } catch (err) {
                setStatus('Erro de conexão: ' + err.message, 'error');
                btn.disabled = false;
            }
        }

        async function emailLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('email-btn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            btn.disabled = true;
            setStatus('Entrando...', 'loading');

            try {
                const res = await fetch(`${BASE}/api/auth/sign-in/email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.error) {
                    setStatus(data.error.message || 'Erro ao autenticar', 'error');
                    btn.disabled = false;
                    return;
                }

                if (data.data && data.data.session) {
                    showSession(data.data);
                } else {
                    window.location.reload();
                }
            } catch (err) {
                setStatus('Erro de conexão: ' + err.message, 'error');
                btn.disabled = false;
            }
        }

        async function logout() {
            try {
                await fetch(`${BASE}/api/auth/sign-out`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch {}
            window.location.reload();
        }

        checkSession();
    </script>
</body>
</html>
